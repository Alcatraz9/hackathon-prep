<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Northstar Operations</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #1f2937; background: #eef2f7; }
    body { margin: 0; } .shell { max-width: 1180px; margin: 0 auto; padding: 28px; }
    .panel { background: white; border: 1px solid #d7dee8; border-radius: 8px; padding: 24px; box-shadow: 0 4px 14px #1f293714; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; } input, select { padding: 10px; border: 1px solid #aab6c5; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 10px 14px; border: 0; border-radius: 4px; background: #1769aa; color: white; cursor: pointer; } .muted { color: #64748b; }
    .hidden { display: none; } .topbar, .toolbar, .nav, .stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .topbar { justify-content: space-between; } .nav { margin: 24px 0; } .nav button { background: #e5edf5; color: #1e3a5f; }
    .stats article { flex: 1; min-width: 150px; background: #f8fafc; padding: 16px; border-left: 4px solid #1769aa; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; } th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; } th { color: #475569; }
    .notice { min-height: 24px; margin-top: 12px; } .error { color: #b42318; } .success { color: #16794a; }
    dialog { border: 0; border-radius: 8px; padding: 24px; box-shadow: 0 12px 50px #0f172a55; }
  </style>
</head>
<body>
  <main class="shell">
    <section id="login-panel" class="panel">
      <h1>Sign in to Northstar</h1><p class="muted">Review orders and operational activity.</p>
      <form id="login-form">
        <label for="email-input">Email</label><input id="email-input" name="email" type="email" placeholder="you@example.com">
        <label for="password-input">Password</label><input id="password-input" name="password" type="password" placeholder="password">
        <button id="login-submit" type="button" onclick="doLogin()">Sign in</button><p id="status-msg" class="notice" aria-live="polite"></p>
      </form>
    </section>
    <section id="dashboard" class="hidden">
      <header class="topbar"><div><h1>Operations overview</h1><p id="welcome-copy" class="muted">Welcome back!</p></div><button id="logout-button" type="button" onclick="logout()">Log out</button></header>
      <nav class="nav" aria-label="Primary"><button id="overview-tab" onclick="showView('overview')">Overview</button><button id="orders-tab" onclick="showView('orders')">Orders</button><button id="settings-tab" onclick="showView('settings')">Settings</button></nav>
      <section id="overview-view" class="panel"><div class="stats"><article><strong>128</strong><br><span class="muted">Open orders</span></article><article><strong>96.4%</strong><br><span class="muted">On-time rate</span></article><article><strong id="sync-status">Syncing...</strong><br><span class="muted">Data status</span></article></div><p>Use Orders to inspect recent activity.</p></section>
      <section id="orders-view" class="panel hidden"><h2>Orders</h2><div class="toolbar"><input id="order-search" type="search" placeholder="Search order or customer"><select id="order-status"><option value="all">All statuses</option><option value="ready">Ready</option><option value="delayed">Delayed</option></select><input id="order-date" type="date"><button id="reset-filters" onclick="resetFilters()">Reset</button></div><p id="filter-message" class="notice"></p>
        <table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody id="orders-body"></tbody></table><p id="empty-state" class="notice hidden">No orders match your filters.</p><button id="load-more" onclick="loadMore()">Load more</button>
      </section>
      <section id="settings-view" class="panel hidden"><h2>Settings</h2><label for="notification-email">Notification email</label><input id="notification-email" type="email" value="ops@example.com"><button id="save-settings" onclick="saveSettings()">Save settings</button><p id="settings-message" class="notice"></p></section>
    </section>
  </main>
  <dialog id="order-dialog"><h2>Edit order</h2><p id="dialog-order"></p><label for="dialog-status">Status</label><select id="dialog-status"><option>Ready</option><option>Delayed</option></select><div class="toolbar"><button id="save-order" onclick="saveOrder()">Save</button><button id="cancel-order" onclick="closeDialog()">Cancel</button></div></dialog>
  <script>
    var orders = [{id:'NS-1001', customer:'Acme Health', status:'Ready', date:'2026-08-20'}, {id:'NS-1002', customer:'Bluebird Retail', status:'Delayed', date:'2026-08-21'}, {id:'NS-1003', customer:'Cedar Labs', status:'Ready', date:'2026-08-22'}, {id:'NS-1004', customer:'Delta Foods', status:'Ready', date:'2026-08-23'}, {id:'NS-1005', customer:'Evergreen Co', status:'Delayed', date:'2026-08-24'}, {id:'NS-1006', customer:'Fathom Works', status:'Ready', date:'2026-08-25'}];
    orders.push({id:'NS-1013',customer:'Maple Goods',status:'Ready',date:'2026-09-01'},{id:'NS-1014',customer:'Noble Air',status:'Delayed',date:'2026-09-02'},{id:'NS-1015',customer:'Orchid Design',status:'Ready',date:'2026-09-03'},{id:'NS-1016',customer:'Pioneer Health',status:'Ready',date:'2026-09-04'});
    var selectedOrder = null;
    function doLogin() { var email = document.getElementById('email-input').value, pass = document.getElementById('password-input').value, status = document.getElementById('status-msg'); if (email && pass) { status.innerText = 'Welcome back!'; status.className = 'notice success'; document.getElementById('login-panel').className = 'panel hidden'; document.getElementById('dashboard').className = ''; renderOrders(); setTimeout(function(){ document.getElementById('sync-status').innerText = 'Up to date'; }, 250); } else { status.innerText = 'Please fill all fields'; status.className = 'notice error'; } }
    function logout() { document.getElementById('dashboard').className = 'hidden'; document.getElementById('login-panel').className = 'panel'; }
    function showView(view) { ['overview','orders','settings'].forEach(function(name){ document.getElementById(name + '-view').className = name === view ? 'panel' : 'panel hidden'; }); }
    function renderOrders() { var body = document.getElementById('orders-body'), query = document.getElementById('order-search').value.toLowerCase(), status = document.getElementById('order-status').value, date = document.getElementById('order-date').value; body.innerHTML = ''; var visible = orders.filter(function(order){ return (!query || (order.id + order.customer).toLowerCase().indexOf(query) >= 0) && (status === 'all' || order.status.toLowerCase() === status) && (!date || order.date === date); }); document.getElementById('empty-state').className = visible.length ? 'notice hidden' : 'notice'; visible.forEach(function(order){ var row = document.createElement('tr'); row.innerHTML = '<td>' + order.id + '</td><td>' + order.customer + '</td><td>' + order.status + '</td><td>' + order.date + '</td><td><button class="row-details" onclick="openOrder(\'' + order.id + '\')">View details</button> <button class="row-edit" onclick="openOrder(\'' + order.id + '\')">Edit</button></td>'; body.appendChild(row); }); }
    function resetFilters() { document.getElementById('order-search').value = ''; document.getElementById('order-status').value = 'all'; document.getElementById('order-date').value = ''; renderOrders(); }
    function loadMore() { document.getElementById('filter-message').innerText = 'All available orders are displayed.'; }
    function openOrder(id) { selectedOrder = orders.find(function(order){ return order.id === id; }); document.getElementById('dialog-order').innerText = selectedOrder.id + ' - ' + selectedOrder.customer; document.getElementById('dialog-status').value = selectedOrder.status; document.getElementById('order-dialog').showModal(); }
    function closeDialog() { document.getElementById('order-dialog').close(); }
    function saveOrder() { selectedOrder.status = document.getElementById('dialog-status').value; closeDialog(); renderOrders(); }
    function saveSettings() { document.getElementById('settings-message').innerText = 'Settings saved'; }
    document.getElementById('order-search').addEventListener('input', renderOrders); document.getElementById('order-status').addEventListener('change', renderOrders); document.getElementById('order-date').addEventListener('change', renderOrders);
  </script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Northstar Operations</title><style>
  :root{font-family:Arial,sans-serif;color:#1f2937;background:#eef2f7}body{margin:0}.shell{max-width:1180px;margin:0 auto;padding:28px}.panel{background:white;border:1px solid #d7dee8;border-radius:8px;padding:24px;box-shadow:0 4px 14px #1f293714}label{display:block;margin:12px 0 5px;font-weight:600}input,select{padding:10px;border:1px solid #aab6c5;border-radius:4px;width:100%;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:4px;background:#1769aa;color:white;cursor:pointer}.muted{color:#64748b}.hidden{display:none}.topbar,.toolbar,.nav,.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.topbar{justify-content:space-between}.nav{margin:24px 0}.nav button{background:#e5edf5;color:#1e3a5f}.stats article{flex:1;min-width:150px;background:#f8fafc;padding:16px;border-left:4px solid #1769aa}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e2e8f0}th{color:#475569}.notice{min-height:24px;margin-top:12px}.error{color:#b42318}.success{color:#16794a}dialog{border:0;border-radius:8px;padding:24px;box-shadow:0 12px 50px #0f172a55}
</style></head><body><main class="shell"><section id="login-panel" class="panel"><h1>Sign in to Northstar</h1><p class="muted">Review orders and operational activity.</p><form id="login-form"><label for="email-input">Email</label><input id="email-input" name="email" type="email" placeholder="you@example.com"><label for="password-input">Password</label><input id="password-input" name="password" type="password" placeholder="password"><button id="login-submit" type="button" onclick="doLogin()">Sign in</button><p id="status-msg" class="notice" aria-live="polite"></p></form></section><section id="dashboard" class="hidden"><header class="topbar"><div><h1>Operations overview</h1><p id="welcome-copy" class="muted">Welcome back!</p></div><button id="logout-button" onclick="logout()">Log out</button></header><nav class="nav" aria-label="Primary"><button id="overview-tab">Overview</button><button id="orders-tab">Orders</button><button id="settings-tab">Settings</button></nav><section id="overview-view" class="panel"><div class="stats"><article><strong>128</strong><br><span class="muted">Open orders</span></article><article><strong>96.4%</strong><br><span class="muted">On-time rate</span></article><article><strong id="sync-status">Syncing...</strong><br><span class="muted">Data status</span></article></div><p>Use Orders to inspect recent activity.</p></section></section></main><script>
// BUG: valid credentials are rejected; selectors and visuals intentionally match v1.
function doLogin(){var email=document.getElementById('email-input').value,pass=document.getElementById('password-input').value;if(!email||!pass){document.getElementById('status-msg').innerText='Welcome back!';}else{document.getElementById('status-msg').innerText='Login failed: invalid credentials';}}function logout(){document.getElementById('dashboard').className='hidden';document.getElementById('login-panel').className='panel';}
</script></body></html>

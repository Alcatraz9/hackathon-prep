<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Northstar Operations</title><style>
  :root { font-family: Georgia, serif; color: #172033; background: #f4f1ea; } body { margin: 0; } .shell { max-width: 1180px; margin: 0 auto; padding: 36px; }
  .panel { background: #fffdf8; border: 1px solid #c9c0af; border-radius: 2px; padding: 28px; box-shadow: 0 5px 16px #55483218; } label { display:block; margin:12px 0 5px; font-weight:600; }
  input, select { padding: 11px; border:1px solid #948876; border-radius:2px; width:100%; box-sizing:border-box; } button { padding:11px 15px; border:0; border-radius:2px; background:#9a3412; color:white; cursor:pointer; }
  .muted { color:#6b6255; } .hidden { display:none; } .topbar, .toolbar, .nav, .stats { display:flex; gap:12px; align-items:center; flex-wrap:wrap; } .topbar { justify-content:space-between; }
  .nav { margin:26px 0; } .nav button { background:#eadfce; color:#542b16; } .stats article { flex:1; min-width:150px; background:#faf5eb; padding:18px; border-top:4px solid #9a3412; }
  table { width:100%; border-collapse:collapse; margin-top:20px; } th,td { text-align:left; padding:13px 8px; border-bottom:1px solid #e4dccd; } th { color:#655747; } .notice { min-height:24px; margin-top:12px; } .error { color:#a11a1a; } .success { color:#176b43; } dialog { border:0; border-radius:2px; padding:26px; box-shadow:0 12px 50px #33221155; }
</style></head><body><main class="shell">
  <section id="auth-panel" class="panel"><h1>Sign in to Northstar</h1><p class="muted">Review orders and operational activity.</p><form id="auth-form">
    <label for="user-email-field">Email</label><input id="user-email-field" name="userEmail" type="email" placeholder="you@example.com">
    <label for="user-pass-field">Password</label><input id="user-pass-field" name="userPassword" type="password" placeholder="password">
    <button id="btn-do-signin" type="button" onclick="doLogin()">Sign in</button><p id="auth-status" class="notice" aria-live="polite"></p>
  </form></section>
  <section id="workspace" class="hidden"><header class="topbar"><div><h1>Operations overview</h1><p id="hello-copy" class="muted">Welcome back!</p></div><button id="signout-action" onclick="logout()">Log out</button></header>
    <nav class="nav" aria-label="Primary"><button id="summary-tab" onclick="showView('summary')">Overview</button><button id="records-tab" onclick="showView('records')">Orders</button><button id="preferences-tab" onclick="showView('preferences')">Settings</button></nav>
    <section id="summary-view" class="panel"><div class="stats"><article><strong>128</strong><br><span class="muted">Open orders</span></article><article><strong>96.4%</strong><br><span class="muted">On-time rate</span></article><article><strong id="data-status">Syncing...</strong><br><span class="muted">Data status</span></article></div><p>Use Orders to inspect recent activity.</p></section>
    <section id="records-view" class="panel hidden"><h2>Orders</h2><div class="toolbar"><input id="records-query" type="search" placeholder="Search order or customer"><select id="records-state"><option value="all">All statuses</option><option value="ready">Ready</option><option value="delayed">Delayed</option></select><input id="records-date" type="date"><button id="clear-record-filters" onclick="resetFilters()">Reset</button></div><p id="records-message" class="notice"></p><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody id="records-body"></tbody></table><p id="no-records" class="notice hidden">No orders match your filters.</p><button id="more-records" onclick="loadMore()">Load more</button></section>
    <section id="preferences-view" class="panel hidden"><h2>Settings</h2><label for="alert-address">Notification email</label><input id="alert-address" type="email" value="ops@example.com"><button id="commit-preferences" onclick="saveSettings()">Save settings</button><p id="preferences-message" class="notice"></p></section>
  </section></main><dialog id="record-dialog"><h2>Edit order</h2><p id="record-title"></p><label for="record-state-editor">Status</label><select id="record-state-editor"><option>Ready</option><option>Delayed</option></select><div class="toolbar"><button id="commit-record" onclick="saveOrder()">Save</button><button id="dismiss-record" onclick="closeDialog()">Cancel</button></div></dialog>
<script>
var orders=[{id:'NS-1001',customer:'Acme Health',status:'Ready',date:'2026-08-20'},{id:'NS-1002',customer:'Bluebird Retail',status:'Delayed',date:'2026-08-21'},{id:'NS-1003',customer:'Cedar Labs',status:'Ready',date:'2026-08-22'},{id:'NS-1004',customer:'Delta Foods',status:'Ready',date:'2026-08-23'},{id:'NS-1005',customer:'Evergreen Co',status:'Delayed',date:'2026-08-24'},{id:'NS-1006',customer:'Fathom Works',status:'Ready',date:'2026-08-25'}],selectedOrder=null;
function doLogin(){var email=document.getElementById('user-email-field').value,pass=document.getElementById('user-pass-field').value,status=document.getElementById('auth-status');if(email&&pass){status.innerText='Welcome back!';status.className='notice success';document.getElementById('auth-panel').className='panel hidden';document.getElementById('workspace').className='';renderOrders();setTimeout(function(){document.getElementById('data-status').innerText='Up to date';},250);}else{status.innerText='Please fill all fields';status.className='notice error';}}
function logout(){document.getElementById('workspace').className='hidden';document.getElementById('auth-panel').className='panel';} function showView(view){['summary','records','preferences'].forEach(function(name){document.getElementById(name+'-view').className=name===view?'panel':'panel hidden';});}
function renderOrders(){var body=document.getElementById('records-body'),query=document.getElementById('records-query').value.toLowerCase(),state=document.getElementById('records-state').value,date=document.getElementById('records-date').value;body.innerHTML='';var visible=orders.filter(function(o){return(!query||(o.id+o.customer).toLowerCase().indexOf(query)>=0)&&(state==='all'||o.status.toLowerCase()===state)&&(!date||o.date===date);});document.getElementById('no-records').className=visible.length?'notice hidden':'notice';visible.forEach(function(o){var row=document.createElement('tr');row.innerHTML='<td>'+o.id+'</td><td>'+o.customer+'</td><td>'+o.status+'</td><td>'+o.date+'</td><td><button class="record-details" onclick="openOrder(\''+o.id+'\')">View details</button> <button class="record-edit" onclick="openOrder(\''+o.id+'\')">Edit</button></td>';body.appendChild(row);});}
function resetFilters(){document.getElementById('records-query').value='';document.getElementById('records-state').value='all';document.getElementById('records-date').value='';renderOrders();}function loadMore(){document.getElementById('records-message').innerText='All available orders are displayed.';}function openOrder(id){selectedOrder=orders.find(function(o){return o.id===id;});document.getElementById('record-title').innerText=selectedOrder.id+' - '+selectedOrder.customer;document.getElementById('record-state-editor').value=selectedOrder.status;document.getElementById('record-dialog').showModal();}function closeDialog(){document.getElementById('record-dialog').close();}function saveOrder(){selectedOrder.status=document.getElementById('record-state-editor').value;closeDialog();renderOrders();}function saveSettings(){document.getElementById('preferences-message').innerText='Settings saved';}
orders.push({id:'NS-1007',customer:'Granite Systems',status:'Ready',date:'2026-08-26'},{id:'NS-1008',customer:'Harbor Media',status:'Delayed',date:'2026-08-27'},{id:'NS-1009',customer:'Indigo Travel',status:'Ready',date:'2026-08-28'},{id:'NS-1010',customer:'Juniper House',status:'Ready',date:'2026-08-29'},{id:'NS-1011',customer:'Keystone Bank',status:'Delayed',date:'2026-08-30'},{id:'NS-1012',customer:'Lumen Energy',status:'Ready',date:'2026-08-31'},{id:'NS-1013',customer:'Maple Goods',status:'Ready',date:'2026-09-01'},{id:'NS-1014',customer:'Noble Air',status:'Delayed',date:'2026-09-02'},{id:'NS-1015',customer:'Orchid Design',status:'Ready',date:'2026-09-03'},{id:'NS-1016',customer:'Pioneer Health',status:'Ready',date:'2026-09-04'});document.getElementById('records-query').addEventListener('input',renderOrders);document.getElementById('records-state').addEventListener('change',renderOrders);document.getElementById('records-date').addEventListener('change',renderOrders);
</script></body></html>
